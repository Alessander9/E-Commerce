<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago confirmado</title>
</head>
<body style="margin:0;background:#f6f2e8;font-family:Arial,sans-serif;color:#1f2937;">
  <div style="max-width:640px;margin:0 auto;padding:40px 20px;">
    <div style="background:#ffffff;border-radius:24px;padding:36px;border:1px solid #e7dfcf;box-shadow:0 18px 40px rgba(9,76,35,0.08);">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="display:inline-block;padding:12px 18px;border-radius:999px;background:#f1f7f2;color:#0b4c23;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;">Allmara Superfoods</div>
      </div>
      <h1 style="margin:0 0 14px;font-size:28px;line-height:1.15;color:#0b4c23;">Tu pago fue confirmado</h1>
      <p style="margin:0 0 18px;font-size:16px;line-height:1.7;color:#4b5563;">Tu pedido <strong th:text="${orderNumber}">#000</strong> ya fue procesado correctamente.</p>
      <div style="display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-radius:18px;background:#f8f5ed;border:1px solid #eadfca;">
        <div>
          <p style="margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b7280;">Monto</p>
          <p style="margin:0;font-size:22px;font-weight:700;color:#0b4c23;" th:text="${amount}">S/ 0.00</p>
        </div>
        <div style="text-align:right;">
          <p style="margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b7280;">Estado</p>
          <p style="margin:0;font-size:22px;font-weight:700;color:#0b4c23;">Pagado</p>
        </div>
      </div>
      <p style="margin:20px 0 0;font-size:15px;line-height:1.7;color:#4b5563;">Gracias por confiar en Allmara Superfoods. Muy pronto podrás revisar el seguimiento de tu pedido desde tu historial.</p>
    </div>
  </div>
</body>
</html>
