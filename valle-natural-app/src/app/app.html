<div class="loading-screen" [class.loading-screen--hidden]="!isLoading()">
  <div class="loading-screen__orb loading-screen__orb--one"></div>
  <div class="loading-screen__orb loading-screen__orb--two"></div>
  <div class="loading-screen__card">
    <div class="loading-screen__logo-wrap">
      <img
        src="/logo-flecha-con-fondo.png"
        alt="ALLMARA SUPERFOODS"
        class="loading-screen__logo"
      />
    </div>
    <div class="loading-screen__brand">ALLMARA SUPERFOODS</div>
    <div class="loading-screen__tagline">Bienestar natural, elegante y consciente</div>
    <div class="loading-screen__loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>

<div class="app-layout" [class.app-layout--ready]="!isLoading()">
  <app-header></app-header>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
